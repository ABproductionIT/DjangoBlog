{% extends "base.html" %}

{% block title %} {{ site_name }} - {{ description }} {% endblock %}

{% block content %}
  {% for post in posts %}
  <div class="article" onclick="window.location.href='{% url 'post_detail' post.id %}';">
    <h2>{{ post.title }}</h2>
    {% if post.main_image %}
      <img src="data:image/png;base64,{{ post.main_image }}" alt="{{ post.title }}">
    {% endif %}
    <p>{{ post.content|truncatewords:30 }}</p>
    <a href="{% url 'post_detail' post.id %}" class="read-more" onclick="event.stopPropagation();">read more...</a>
  </div>
  {% empty %}
    <p>No posts.</p>
  {% endfor %}
{% endblock %}
