{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    header {
      background-color: #333;
      color: #fff;
      padding: 15px 20px;
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }
    .article {
      border-bottom: 1px solid #ddd;
      padding-bottom: 15px;
      margin-bottom: 15px;
      overflow: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }
    .article h2 {
      color: #333;
    }
    .article img {
      float: left;
      margin: 0 15px 10px 0;
      max-width: 40%;
      height: auto;
    }
    .article p {
      color: #666;
      text-align: justify;
    }
    .read-more {
      display: inline-block;
      margin-top: 10px;
      color: #0066cc;
      text-decoration: none;
    }
    .read-more:hover {
      text-decoration: underline;
    }
    footer {
      text-align: center;
      padding: 10px;
      background: #333;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>
<body>
<header onclick="window.location.href='{% url 'index' %}';" style="cursor: pointer;">
  <h1>{{ site_name }}</h1>
  <p>{{ description }}</p>
</header>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <footer>
    <p>&copy; 2025 {{ site_name }}.</p>
  </footer>
</body>
</html>
